# Reverse proxy Hostinger pour ppacilyoncentre.com
# À copier dans /etc/nginx/sites-available/ ou /etc/nginx/conf.d/ sur le VPS Hostinger
# Puis : ln -s /etc/nginx/sites-available/ppacilyoncentre.conf /etc/nginx/sites-enabled/
# Puis : nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name ppacilyoncentre.com www.ppacilyoncentre.com;

    # Redirection HTTP -> HTTPS (décommenter si SSL configuré)
    # return 301 https://$server_name$request_uri;
    # }

    # server {
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # server_name ppacilyoncentre.com www.ppacilyoncentre.com;
    # ssl_certificate /etc/letsencrypt/live/ppacilyoncentre.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ppacilyoncentre.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 600M;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
