# Config nginx HTTPS ppacilyoncentre - proxy vers Docker 8085
# À copier vers /etc/nginx/sites-available/ppacilyoncentre.com

server {
    if ($host = www.ppacilyoncentre.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = ppacilyoncentre.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name ppacilyoncentre.com www.ppacilyoncentre.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ppacilyoncentre.com www.ppacilyoncentre.com;

    client_max_body_size 600M;
    access_log /var/log/nginx/ppacilyoncentre.access.log;
    error_log  /var/log/nginx/ppacilyoncentre.error.log;

    ssl_certificate /etc/letsencrypt/live/ppacilyoncentre.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ppacilyoncentre.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
