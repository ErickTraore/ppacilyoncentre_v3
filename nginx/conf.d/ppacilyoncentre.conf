# File: ppacilyoncentre/nginx/conf.d/ppacilyoncentre.conf
# API users -> user-backend local (Docker)
# API media / presse locale / uploads -> Contabo (même schéma que cppeurope : port 80 pour /api/media)

server {
    listen 80;
    server_name _;

    # API users (Hostinger, user-backend local)
    location /api/users/ {
        proxy_pass         http://user-backend:7004/api/users/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/infoProfile/ {
        proxy_pass         http://user-backend:7004/api/infoProfile/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # API media (Contabo – même proxy que cppeurope, port 80)
    location /api/media/ {
        proxy_pass         http://62.171.186.233/api/media/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 600M;
    }

    # API presse locale (Contabo ppacilyon-presseLocale-backend :7105)
    # Le backend écoute sous /api/messages/... → on propage /api/presse-locale/* vers /api/* côté Contabo.
    location /api/presse-locale/ {
        proxy_pass         http://62.171.186.233:7105/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 600M;
    }

    # API media locale (Contabo ppacilyon-mediaLocale-backend :7106)
    # Timeouts longs pour upload vidéo (fichiers 6+ Mo)
    location /api/media-locale/ {
        proxy_pass         http://62.171.186.233:7106/api/media-locale/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 600M;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Fichiers media profile (Contabo, même entrée que cppeurope)
    location /mediaprofile/ {
        proxy_pass         http://62.171.186.233/mediaprofile/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    # Images de profil (Contabo, même entrée que cppeurope)
    location /imagesprofile/ {
        proxy_pass         http://62.171.186.233/imagesprofile/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    location /media-backend/ {
        proxy_pass         http://62.171.186.233/api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    location /api/uploads/ {
        proxy_pass         http://62.171.186.233/api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    location /api/uploads-locale/ {
        proxy_pass         http://62.171.186.233:7106/api/uploads-locale/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    # Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            expires -1;
        }

        location ~* \.(js|css)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
